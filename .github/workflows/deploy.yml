name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu

      - name: Generate build version stamp
        run: |
          mkdir -p public
          node -e '
            const fs = require("fs");
            const p = "public/version.json";
            let version = "1.4.4";
            try {
              const cur = JSON.parse(fs.readFileSync(p, "utf8"));
              if (cur && typeof cur.version === "string" && /^\d+(\.\d+)+$/.test(cur.version.trim())) {
                version = cur.version.trim();
              }
            } catch {}
            fs.writeFileSync(p, JSON.stringify({ version, commit: process.env.GITHUB_SHA || "", buildTime: Date.now() }, null, 2) + "\n");
          '
          if [ -d "Music" ]; then cp -r Music public/; fi

      - name: Build production app
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
